<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edzésnapló</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏋️‍♂️ Edzésnapló</h1>
        
        <form id="workout-form">
            <div class="form-group">
                <label for="exercise">Gyakorlat neve:</label>
                <input type="text" id="exercise" placeholder="pl. Fekvenyomás" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="weight">Súly (kg):</label>
                    <input type="number" id="weight" placeholder="80" step="0.5" required>
                </div>
                <div class="form-group">
                    <label for="reps">Ismétlés:</label>
                    <input type="number" id="reps" placeholder="10" required>
                </div>
            </div>

            <button type="submit" id="save-btn">Mentés</button>
        </form>

        <h2>Mai edzés</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Gyakorlat</th>
                        <th>Súly</th>
                        <th>Ismétlés</th>
                        <th>Törlés</th>
                    </tr>
                </thead>
                <tbody id="workout-list">
                    <!-- Itt jelennek meg a mentett gyakorlatok -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
