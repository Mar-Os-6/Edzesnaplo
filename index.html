<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profi Edzésnapló</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏋️‍♂️ Edzésnapló</h1>

        <!-- 1. PIHENŐIDŐ IDŐZÍTŐ -->
        <div class="timer-card">
            <h3>⏱️ Pihenőidő Stopper</h3>
            <div id="timer-display">01:00</div>
            <div class="timer-buttons">
                <button type="button" class="timer-btn" onclick="setTimer(60)">60 mp</button>
                <button type="button" class="timer-btn" onclick="setTimer(90)">90 mp</button>
                <button type="button" class="timer-btn" onclick="setTimer(120)">120 mp</button>
            </div>
            <div class="timer-controls">
                <button type="button" id="start-timer-btn">Start / Szünet</button>
                <button type="button" id="reset-timer-btn">Visszaállítás</button>
            </div>
        </div>

        <!-- 2. EDZÉSRÖGZÍTŐ ŰRLAP -->
        <form id="workout-form">
            <div class="form-group">
                <label for="workout-date">Dátum:</label>
                <input type="date" id="workout-date" required>
            </div>

            <!-- IZOMCSOPORT VÁLASZTÓ -->
            <div class="form-group">
                <label for="muscle-group">Izomcsoport:</label>
                <select id="muscle-group">
                    <option value="Mell">Mell</option>
                    <option value="Bicepsz">Bicepsz</option>
                    <option value="Hát">Hát</option>
                    <option value="Tricepsz">Tricepsz</option>
                    <option value="Váll">Váll</option>
                    <option value="Láb">Láb</option>
                    <option value="Has">Has</option>
                    <option value="Kardió">Kardió</option>
                </select>
            </div>

            <!-- GYORSGYAKORLAT GOMBOK KONTÉNERE -->
            <div class="form-group">
                <label>Kattints a gyakorlatra (vagy írd be alább):</label>
                <div id="quick-exercises" class="chip-container"></div>
            </div>

            <div class="form-group">
                <label for="exercise">Gyakorlat neve:</label>
                <input type="text" id="exercise" placeholder="pl. Fekvenyomás" required autocomplete="off">
                <small id="history-hint" class="hint"></small>
            </div>

            <!-- SÚLYZÓS MEZŐK (ALAPÉRTELMEZETT) -->
            <div id="resistance-fields" class="form-row">
                <div class="form-group">
                    <label for="weight">Súly (kg):</label>
                    <input type="number" id="weight" placeholder="80" step="0.5">
                </div>
                <div class="form-group">
                    <label for="reps">Ismétlés:</label>
                    <input type="number" id="reps" placeholder="10">
                </div>
            </div>

            <!-- KARDIÓ MEZŐK (AUTOMATIKUSAN JELENIK MEG KARDIÓNÁL) -->
            <div id="cardio-fields" class="form-row hidden">
                <div class="form-group">
                    <label for="cardio-time">Idő (perc):</label>
                    <input type="number" id="cardio-time" placeholder="20">
                </div>
                <div class="form-group">
                    <label for="cardio-incline">Dőlésszög / Fokozat:</label>
                    <input type="text" id="cardio-incline" placeholder="pl. 12% vagy 8. fokozat">
                </div>
                <div class="form-group">
                    <label for="cardio-speed">Sebesség (km/h):</label>
                    <input type="number" id="cardio-speed" placeholder="5.5" step="0.1">
                </div>
            </div>

            <div class="form-group">
                <label for="note">Megjegyzés (pl. könnyű volt, 2. fokozat):</label>
                <input type="text" id="note" placeholder="Opcionális megjegyzés">
            </div>

            <button type="submit" id="save-btn">Mentés</button>
        </form>

        <!-- 3. KERESŐ ÉS ELŐZMÉNYEK -->
        <div class="action-header">
            <h2>Mai és korábbi edzések</h2>
            <button id="export-btn" class="secondary-btn">💾 Adatok letöltése</button>
        </div>

        <div class="form-group">
            <input type="text" id="search-filter" placeholder="🔍 Keresés gyakorlatra vagy dátumra...">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Dátum</th>
                        <th>Izomcsoport</th>
                        <th>Gyakorlat</th>
                        <th>Súly / Idő</th>
                        <th>Ismétlés / Részletek</th>
                        <th>Jegyzet</th>
                        <th>Törlés</th>
                    </tr>
                </thead>
                <tbody id="workout-list"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
