<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edzés Napló</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- MELLÉKLETTEL EGYÜTTI CÍMSOR -->
        <header class="app-header">
            <h1>💪 Edzés Napló</h1>
            <p class="subtitle">Kövesd a fejlődésed napról napra</p>
        </header>

        <!-- ÖSSZECSUKHATÓ IDŐZÍTŐ ÉS STOPPER -->
        <details class="timer-accordion">
            <summary class="timer-summary">
                <span>⏱️ Időzítő & Stopperóra</span>
                <span class="chevron">▼</span>
            </summary>
            <div class="timer-content">
                <!-- Módválasztó fülek -->
                <div class="timer-tabs">
                    <button type="button" id="tab-stopwatch" class="tab-btn active" onclick="switchTimerTab('stopwatch')">Stopper (Felfelé)</button>
                    <button type="button" id="tab-countdown" class="tab-btn" onclick="switchTimerTab('countdown')">Időzítő (Lefelé)</button>
                </div>

                <!-- 1. STOPPERÓRA -->
                <div id="stopwatch-view" class="timer-view">
                    <div id="stopwatch-display" class="timer-display">00:00:00</div>
                    <div class="timer-controls">
                        <button type="button" id="sw-start-btn" class="primary-timer-btn" onclick="toggleStopwatch()">Indítás</button>
                        <button type="button" class="secondary-timer-btn" onclick="resetStopwatch()">Nullázás</button>
                    </div>
                </div>

                <!-- 2. VISSZASZÁMLÁLÓ IDŐZÍTŐ -->
                <div id="countdown-view" class="timer-view hidden">
                    <div id="countdown-display" class="timer-display">01:00</div>
                    
                    <!-- Egyéni idő megadása -->
                    <div class="countdown-inputs">
                        <div class="input-group-time">
                            <input type="number" id="cd-minutes" value="1" min="0" max="999">
                            <label>perc</label>
                        </div>
                        <div class="input-group-time">
                            <input type="number" id="cd-seconds" value="0" min="0" max="59">
                            <label>mp</label>
                        </div>
                    </div>

                    <!-- Gyorsgombok -->
                    <div class="preset-btns">
                        <button type="button" onclick="setCountdownPreset(30)">30s</button>
                        <button type="button" onclick="setCountdownPreset(60)">1p</button>
                        <button type="button" onclick="setCountdownPreset(120)">2p</button>
                        <button type="button" onclick="setCountdownPreset(300)">5p</button>
                    </div>

                    <div class="timer-controls">
                        <button type="button" id="cd-start-btn" class="primary-timer-btn" onclick="toggleCountdown()">Indítás</button>
                        <button type="button" class="secondary-timer-btn" onclick="resetCountdown()">Nullázás</button>
                    </div>
                </div>
            </div>
        </details>

        <!-- SABLON KÁRTYA -->
        <div class="card template-card">
            <h3>📋 Edzéssablonok</h3>
            <div id="active-template-banner" class="active-banner hidden">
                <span id="active-template-name"></span>
                <button type="button" class="close-btn" onclick="clearActiveTemplate()">Kilépés</button>
            </div>
            <div class="form-group">
                <label for="template-select">Sablon betöltése:</label>
                <select id="template-select" onchange="loadSelectedTemplate()">
                    <option value="">-- Válassz sablont --</option>
                </select>
            </div>
            <button type="button" class="secondary-btn-full" onclick="toggleCreateTemplateBox()">+ Új sablon létrehozása</button>
            
            <div id="create-template-box" class="create-box hidden">
                <h4>Új sablon mentése</h4>
                <div class="form-group">
                    <input type="text" id="new-template-name" placeholder="Sablon neve (pl. Mell-Bicepsz)">
                </div>
                <label>Gyakorlatok kiválasztása:</label>
                <div id="template-exercise-chips" class="chip-container"></div>
                <div class="selected-ex-box" id="selected-template-exercises-text">Nincs kiválasztva gyakorlat.</div>
                <button type="button" id="save-template-btn" class="primary-timer-btn" style="width: 100%; margin-top: 12px;" onclick="saveNewTemplate()">Sablon Mentése</button>
            </div>
        </div>

        <!-- EDZÉS RÖGZÍTÉSE ÚRLAP -->
        <form id="workout-form" class="card">
            <div class="form-row">
                <div class="form-group">
                    <label for="date">Dátum:</label>
                    <input type="date" id="date" required>
                </div>
            </div>

            <div class="form-group">
                <label for="workout-type">Edzés típusa / Izomcsoport:</label>
                <select id="workout-type" onchange="filterExercisesByCategory()">
                    <option value="Összes">Összes</option>
                    <option value="Mell">Mell</option>
                    <option value="Hát">Hát</option>
                    <option value="Láb">Láb</option>
                    <option value="Váll">Váll</option>
                    <option value="Kar">Kar</option>
                    <option value="Has">Has</option>
                    <option value="Kardió">Kardió</option>
                </select>
            </div>

            <div class="form-group">
                <label for="exercise-select">Gyakorlat kiválasztása:</label>
                <select id="exercise-select">
                    <option value="">-- Válassz gyakorlatot --</option>
                </select>
            </div>

            <!-- Gyakorlat gombok (Chipek) -->
            <div class="form-group">
                <label>Gyorsválasztó csempék:</label>
                <div id="exercise-chips" class="chip-container"></div>
            </div>

            <!-- Új gyakorlat hozzáadása -->
            <div class="form-group">
                <div class="input-with-btn">
                    <input type="text" id="custom-exercise-input" placeholder="Új gyakorlat neve">
                    <button type="button" class="secondary-timer-btn" onclick="addNewCustomExercise()">Hozzáadás</button>
                </div>
            </div>

            <span class="section-label">Sorozatok</span>
            <div id="sets-container">
                <!-- Dinamikusan generált sorozatok -->
            </div>

            <button type="button" class="secondary-btn-full" onclick="addSetRow()">+ Új sorozat hozzáadása</button>

            <button type="submit" id="save-btn">Edzés Mentése</button>
        </form>

        <!-- TÖRTÉNET ÉS TÁBLÁZAT -->
        <div class="action-header">
            <h2>Előző edzések</h2>
            <div class="btn-group">
                <button type="button" class="secondary-btn" onclick="exportData()">Export</button>
                <button type="button" class="secondary-btn" onclick="triggerImport()">Import</button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
            </div>
        </div>

        <div class="table-wrapper card">
            <table>
                <thead>
                    <tr>
                        <th>Dátum</th>
                        <th>Gyakorlat</th>
                        <th>Sorozatok</th>
                        <th>Művelet</th>
                    </tr>
                </thead>
                <tbody id="workout-history-body">
                    <!-- Dinamikus edzés előzmények -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
