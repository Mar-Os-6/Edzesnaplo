<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profi Edzésnapló</title>
    
    <!-- PWA BEÁLLÍTÁSOK -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00e676">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Edzésnapló">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2548/2548537.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏋️‍♂️ Edzésnapló</h1>

        <!-- 1. PIHENŐIDŐ IDŐZÍTŐ -->
        <div class="timer-card">
            <h3>⏱️ Pihenőidő Stopper</h3>
            <div id="timer-display">01:00</div>
            <div class="timer-buttons">
                <button type="button" class="timer-btn" onclick="setTimer(60)">60 mp</button>
                <button type="button" class="timer-btn" onclick="setTimer(90)">90 mp</button>
                <button type="button" class="timer-btn" onclick="setTimer(120)">120 mp</button>
            </div>
            <div class="timer-controls">
                <button type="button" id="start-timer-btn">Start / Szünet</button>
                <button type="button" id="reset-timer-btn">Visszaállítás</button>
            </div>
        </div>

        <!-- 2. EDZÉSTERV SABLONOK KÁRTYA -->
        <div class="template-card">
            <h3>📋 Edzésterv Sablonok</h3>
            
            <!-- AKTÍV SABLON ÁLLAPOTJELZŐ (HA FUT EGY SABLON) -->
            <div id="active-template-banner" class="active-banner hidden">
                <span id="active-template-info"></span>
                <button type="button" id="cancel-template-btn" class="close-btn">✕ Megszakítás</button>
            </div>

            <!-- SABLON VÁLASZTÓ ÉS KEZELŐ GOMBOK -->
            <div id="template-select-box" class="form-group">
                <select id="template-select">
                    <option value="">-- Válassz edzéstervet --</option>
                </select>
                <div class="btn-group" style="margin-top: 8px;">
                    <button type="button" id="start-template-btn" class="secondary-btn">🚀 Edzés indítása</button>
                    <button type="button" id="edit-template-btn" class="secondary-btn">✏️ Szerkesztés</button>
                    <button type="button" id="toggle-new-template-btn" class="secondary-btn">+ Új Sablon</button>
                    <button type="button" id="delete-template-btn" class="secondary-btn danger-text">🗑️ Törlés</button>
                </div>
            </div>

            <!-- ÚJ / SZERKESZTETT SABLON LÉTREHOZÁSA DOBOZ -->
            <div id="create-template-box" class="create-box hidden">
                <h4 id="template-form-title">Új Sablon Létrehozása</h4>
                
                <div class="form-group">
                    <label for="new-template-name">Sablon neve:</label>
                    <input type="text" id="new-template-name" placeholder="pl. A nap: Mell-Tricepsz">
                </div>

                <div class="form-group">
                    <label>Érintett izomcsoportok (kattints a kijelöléshez):</label>
                    <div id="template-muscle-chips" class="chip-container"></div>
                </div>

                <div class="form-group">
                    <label>Meglévő gyakorlatok (kattints rá a hozzáadáshoz):</label>
                    <div id="template-available-exercises" class="chip-container"></div>
                </div>

                <div class="form-group">
                    <label>Egyedi gyakorlat beírása (ha nincs a listában):</label>
                    <div class="input-with-btn">
                        <input type="text" id="custom-template-ex-input" placeholder="pl. Csigás keresztezés">
                        <button type="button" id="add-custom-template-ex-btn" class="secondary-btn">+ Hozzáad</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>A sablonba kiválasztott gyakorlatok (sorrendben):</label>
                    <div id="template-selected-exercises" class="chip-container selected-ex-box"></div>
                </div>

                <div class="btn-group" style="margin-top: 15px;">
                    <button type="button" id="save-new-template-btn" class="secondary-btn">💾 Sablon Mentése</button>
                    <button type="button" id="cancel-new-template-btn" class="secondary-btn">Mégse</button>
                </div>
            </div>
        </div>

        <!-- 3. EDZÉSRÖGZÍTŐ ŰRLAP -->
        <form id="workout-form">
            <div class="form-group">
                <label for="workout-date">Dátum:</label>
                <input type="date" id="workout-date" required>
            </div>

            <div class="form-group">
                <label for="muscle-group">Izomcsoport:</label>
                <select id="muscle-group">
                    <option value="Mell">Mell</option>
                    <option value="Bicepsz">Bicepsz</option>
                    <option value="Hát">Hát</option>
                    <option value="Tricepsz">Tricepsz</option>
                    <option value="Váll">Váll</option>
                    <option value="Láb">Láb</option>
                    <option value="Has">Has</option>
                    <option value="Kardió">Kardió</option>
                </select>
            </div>

            <div class="form-group">
                <label>Kattints a gyakorlatra (vagy írd be alább):</label>
                <div id="quick-exercises" class="chip-container"></div>
            </div>

            <div class="form-group">
                <label for="exercise">Gyakorlat neve:</label>
                <input type="text" id="exercise" placeholder="pl. Fekvenyomás" required autocomplete="off">
                <small id="history-hint" class="hint"></small>
            </div>

            <div id="resistance-fields">
                <label class="section-label">Sorozatok:</label>
                <div id="sets-container"></div>
                <button type="button" id="add-set-btn" class="secondary-btn-full">+ SOROZAT HOZZÁADÁSA</button>
            </div>

            <div id="cardio-fields" class="form-row hidden">
                <div class="form-group">
                    <label for="cardio-time">Idő (perc):</label>
                    <input type="number" id="cardio-time" placeholder="20">
                </div>
                <div class="form-group">
                    <label for="cardio-incline">Dőlésszög / Fokozat:</label>
                    <input type="text" id="cardio-incline" placeholder="pl. 12% vagy 8. fokozat">
                </div>
                <div class="form-group">
                    <label for="cardio-speed">Sebesség (km/h):</label>
                    <input type="number" id="cardio-speed" placeholder="5.5" step="0.1">
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label for="note">Megjegyzés:</label>
                <input type="text" id="note" placeholder="Opcionális megjegyzés">
            </div>

            <button type="submit" id="save-btn">Mentés</button>
        </form>

        <!-- 4. KERESŐ ÉS ELŐZMÉNYEK -->
        <div class="action-header">
            <h2>Mai és korábbi edzések</h2>
            <div class="btn-group">
                <button id="import-btn" class="secondary-btn">📥 Adatok feltöltése</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
                <button id="export-btn" class="secondary-btn">💾 Adatok letöltése</button>
            </div>
        </div>

        <div class="form-group">
            <input type="text" id="search-filter" placeholder="🔍 Keresés gyakorlatra vagy dátumra...">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Dátum</th>
                        <th>Izomcsoport</th>
                        <th>Gyakorlat</th>
                        <th>Súly / Idő</th>
                        <th>Ismétlés / Részletek</th>
                        <th>Jegyzet</th>
                        <th>Törlés</th>
                    </tr>
                </thead>
                <tbody id="workout-list"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
